<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaBus — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/layout.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=8">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="NammaBus home">
        nammabus<span class="brand__cursor"></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
        <a class="nav-link" href="map.html" data-i18n="nav.map">Map</a>
        <a class="nav-link" href="bookings.html" data-i18n="nav.bookings">My Bookings</a>
        <a class="nav-link" href="admin.html" aria-current="page" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <span class="status-chip status-chip--simulated" id="statusChip"><span class="ticker-dot"></span> SIMULATED - TICK 2S</span>
        <button id="langToggle" class="nav-link" type="button" aria-label="Toggle language">ಕ</button>
        <button id="themeToggle" class="btn btn--sm" type="button" aria-label="Toggle theme">LIGHT</button>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section__head">
      <div>
        <h1 class="section__title">Admin (demo)</h1>
        <p class="section__sub">Add/edit buses, routes, trips; view bookings; reset demo data.</p>
      </div>
      <button id="resetBtn" class="btn btn--sm" type="button">Reset demo data</button>
    </div>

    <div class="grid grid--3">
      <div class="card">
        <h3 style="margin:0 0 var(--sp-2);">Buses</h3>
        <div id="busTable" style="font-size:0.82rem;max-height:240px;overflow:auto;"></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 var(--sp-2);">Routes</h3>
        <div id="routeTable" style="font-size:0.82rem;max-height:240px;overflow:auto;"></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 var(--sp-2);">Bookings</h3>
        <div id="bookingTable" style="font-size:0.82rem;max-height:240px;overflow:auto;"></div>
      </div>
    </div>

    <div class="card" style="margin-top:var(--sp-5);">
      <h3 style="margin:0 0 var(--sp-2);">Add a bus</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:var(--sp-3);align-items:end;">
        <div class="field"><label>Number</label><input id="bNum"></div>
        <div class="field"><label>Type</label><select id="bType"><option>Ordinary</option><option>Express</option><option>Rajahamsa</option><option>Airavat</option></select></div>
        <div class="field"><label>Total seats</label><input id="bSeats" type="number" value="40"></div>
        <div class="field"><label>Fare/km</label><input id="bFare" type="number" step="0.1" value="1.1"></div>
        <button id="addBus" class="btn btn--sm btn--primary" type="button">Add</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>NammaBus · Student prototype.</span>
      <span class="disclaimer">Admin is unprotected demo.</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/theme.js?v=3"></script>
</body>
</html>
