<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaBus — My Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/layout.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=8">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="NammaBus home">
        nammabus<span class="brand__cursor"></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
        <a class="nav-link" href="map.html" data-i18n="nav.map">Map</a>
        <a class="nav-link" href="bookings.html" aria-current="page" data-i18n="nav.bookings">My Bookings</a>
        <a class="nav-link" href="admin.html" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <span class="status-chip status-chip--simulated" id="statusChip"><span class="ticker-dot"></span> SIMULATED - TICK 2S</span>
        <button id="langToggle" class="nav-link" type="button" aria-label="Toggle language">ಕ</button>
        <button id="themeToggle" class="btn btn--sm" type="button" aria-label="Toggle theme">LIGHT</button>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section__head">
      <div>
        <h1 class="section__title">My bookings</h1>
        <p class="section__sub">Upcoming and past trips from this browser.</p>
      </div>
    </div>
    <div id="upcoming" class="grid" style="grid-template-columns:1fr;margin-bottom:var(--sp-6);"></div>
    <h2 style="font-size:1.2rem;margin-bottom:var(--sp-3);">Past / cancelled</h2>
    <div id="past" class="grid" style="grid-template-columns:1fr;"></div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>NammaBus · Student prototype.</span>
      <span class="disclaimer">Demo bookings only.</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/bookings.js"></script>
  <script src="js/theme.js?v=3"></script>
</body>
</html>
