<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaBus — Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/layout.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=8">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="NammaBus home">
        nammabus<span class="brand__cursor"></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
        <a class="nav-link" href="map.html" data-i18n="nav.map">Map</a>
        <a class="nav-link" href="bookings.html" data-i18n="nav.bookings">My Bookings</a>
        <a class="nav-link" href="admin.html" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <span class="status-chip status-chip--simulated" id="statusChip"><span class="ticker-dot"></span> SIMULATED - TICK 2S</span>
        <button id="langToggle" class="nav-link" type="button" aria-label="Toggle language">ಕ</button>
        <button id="themeToggle" class="btn btn--sm" type="button" aria-label="Toggle theme">LIGHT</button>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section__head">
      <div>
        <h1 class="section__title">Demo payment</h1>
        <p class="section__sub">No real money is charged. This is a student prototype.</p>
      </div>
    </div>

    <div class="card" style="max-width:520px;margin:0 auto;">
      <div class="status-chip status-chip--simulated" style="margin-bottom:var(--sp-3);">Demo payment, no real money</div>
      <div id="summary" style="margin-bottom:var(--sp-3);color:var(--muted);font-size:0.9rem;"></div>

      <div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-3);">
        <button class="btn btn--sm" id="tabCard" type="button">Card</button>
        <button class="btn btn--sm" id="tabUpi" type="button">UPI</button>
      </div>

      <form id="cardForm">
        <div class="field"><label>Card number</label><input id="cardNum" placeholder="4242 4242 4242 4242" maxlength="19"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);">
          <div class="field"><label>Expiry (MM/YY)</label><input id="cardExp" placeholder="12/26" maxlength="5"></div>
          <div class="field"><label>CVV</label><input id="cardCvv" placeholder="123" maxlength="3" type="password"></div>
        </div>
        <div class="field"><label>Name on card</label><input id="cardName" placeholder="Demo User"></div>
      </form>

      <form id="upiForm" style="display:none;">
        <div class="field"><label>UPI ID</label><input id="upiId" placeholder="demo@upi"></div>
      </form>

      <div id="error" style="color:var(--status-offline);font-size:0.85rem;margin-top:var(--sp-3);"></div>

      <button id="payBtn" class="btn btn--primary" type="button" style="width:100%;margin-top:var(--sp-4);">Pay now</button>

      <div id="loading" style="display:none;text-align:center;padding:var(--sp-5);">
        <div style="width:48px;height:48px;border:4px solid var(--border-strong);border-top-color:var(--express);border-radius:50%;margin:0 auto var(--sp-3);animation:spin 0.8s linear infinite;"></div>
        <p style="color:var(--muted);">Processing demo payment…</p>
      </div>
    </div>
  </main>

  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>NammaBus · Student prototype.</span>
      <span class="disclaimer">Demo payment only. No real money. Do not enter real card details.</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/theme.js?v=3"></script>
</body>
</html>
