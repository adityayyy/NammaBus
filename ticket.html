<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaBus — Ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/layout.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=8">
  <style>
    @media print {
      .site-header, .site-footer, .no-print { display: none !important; }
      body { background: #fff; color: #000; }
      .ticket { box-shadow: none; border: 2px solid #000; }
    }
  </style>
</head>
<body>

  <header class="site-header no-print">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="NammaBus home">
        nammabus<span class="brand__cursor"></span>
      </a>
      <nav class="site-nav no-print" aria-label="Main navigation">
        <a class="nav-link" href="index.html" data-i18n="nav.home">Home</a>
        <a class="nav-link" href="map.html" data-i18n="nav.map">Map</a>
        <a class="nav-link" href="bookings.html" data-i18n="nav.bookings">My Bookings</a>
        <a class="nav-link" href="admin.html" data-i18n="nav.admin">Admin</a>
      </nav>
      <div class="header-actions">
        <span class="status-chip status-chip--simulated" id="statusChip"><span class="ticker-dot"></span> SIMULATED - TICK 2S</span>
        <button id="langToggle" class="nav-link no-print" type="button" aria-label="Toggle language">ಕ</button>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="ticket card" id="ticket" style="max-width:640px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:var(--sp-4);">
        <h1 style="margin:0;font-size:1.5rem;">NammaBus</h1>
        <p style="color:var(--muted);font-size:0.85rem;margin:0;">E-Ticket · Demo data</p>
      </div>
      <div id="ticketBody"></div>
      <div style="display:flex;justify-content:center;margin:var(--sp-5) 0;">
        <canvas id="qr" width="140" height="140" style="border:1px solid var(--glass-border);border-radius:var(--r-md);"></canvas>
      </div>
      <p style="text-align:center;color:var(--muted);font-size:0.75rem;">Scan placeholder (generated from booking ID)</p>
      <div class="no-print" style="display:flex;gap:var(--sp-3);justify-content:center;margin-top:var(--sp-4);">
        <button class="btn btn--primary" onclick="window.print()">Print</button>
        <button class="btn" onclick="downloadPdf()">Download PDF</button>
      </div>
    </div>
  </main>

  <footer class="site-footer no-print">
    <div class="container site-footer__inner">
      <span>NammaBus · Student prototype.</span>
      <span class="disclaimer">Demo ticket. No real travel.</span>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ticket.js"></script>
  <script src="js/theme.js?v=3"></script>
</body>
</html>
